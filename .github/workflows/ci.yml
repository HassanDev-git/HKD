name: HKD CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-audit:
    name: Lint, Typecheck & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: System Health Doctor
        run: node dist/cli/main.js doctor
      - name: Dependency Security Audit
        run: node dist/cli/main.js audit

  test-matrix:
    name: Test on ${{ matrix.os }}
    needs: [lint-and-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Ensure Executable Permissions
        if: runner.os != 'Windows'
        run: |
          chmod +x node_modules/@zigc/*/bin/* || true
      - name: Build Native Runtime
        run: |
          node -e "
            const { spawnSync } = require('child_process');
            const path = require('path');
            const fs = require('fs');
            const isWin = process.platform === 'win32';
            const isDarwin = process.platform === 'darwin';
            const arch = process.arch === 'arm64' ? 'arm64' : 'x64';
            const plat = isWin ? 'win32-x64' : (isDarwin ? 'darwin-' + arch : 'linux-' + arch);
            const bin = isWin ? 'zig.exe' : 'zig';
            const zigBin = path.resolve('node_modules', '@zigc', plat, 'bin', bin);
            if (fs.existsSync(zigBin)) {
              if (!isWin) try { fs.chmodSync(zigBin, 0o755); } catch {}
              const res = spawnSync(zigBin, ['build', '-Doptimize=ReleaseFast'], { cwd: 'native-runtime', stdio: 'inherit' });
              process.exit(res.status ?? 0);
            }
          " || true
      - name: Run Test Suite
        run: npm test

  container-build:
    name: Verify Multi-Stage Container Build
    needs: [lint-and-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Dockerfile
        run: node dist/cli/main.js container init
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: hkd-app:test
