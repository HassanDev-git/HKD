name: HKD Verified Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hkd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-arm64-runtime-crossbuild:
    name: Cross-build Windows ARM64 native runtime
    runs-on: ubuntu-24.04
    outputs:
      runtime-sha256: ${{ steps.build.outputs.runtime_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build Windows ARM64 runtime using Linux Zig host
        id: build
        run: node scripts/ci-zig-crossbuild-windows-arm64.cjs
      - name: Preserve Windows ARM64 runtime for native execution
        uses: actions/upload-artifact@v6
        with:
          name: hkd-release-native-runtime-windows-arm64
          path: native-runtime/zig-out/bin/hkd-runtime.exe
          if-no-files-found: error

  build-and-verify:
    name: ${{ matrix.platform }} native package
    needs: windows-arm64-runtime-crossbuild
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            id: windows-x64
            platform: Windows x64
            zig: win32-x64
          - runner: windows-11-arm
            id: windows-arm64
            platform: Windows ARM64
            zig: win32-arm64
          - runner: ubuntu-24.04
            id: linux-x64
            platform: Linux x64
            zig: linux-x64
          - runner: ubuntu-24.04-arm
            id: linux-arm64
            platform: Linux ARM64
            zig: linux-arm64
          - runner: macos-15-intel
            id: macos-x64
            platform: macOS x64
            zig: darwin-x64
          - runner: macos-15
            id: macos-arm64
            platform: macOS ARM64
            zig: darwin-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Windows x64 Zig compiler for ARM64 test target
        if: matrix.id == 'windows-arm64'
        run: npm install --no-save --package-lock=false --force @zigc/win32-x64@0.16.0
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build TypeScript CLI
        run: npm run build
      - name: Download Windows ARM64 native runtime built on Linux
        if: matrix.id == 'windows-arm64'
        uses: actions/download-artifact@v7
        with:
          name: hkd-release-native-runtime-windows-arm64
          path: ${{ runner.temp }}/hkd-runtime
      - name: Run Zig tests and ReleaseFast runtime startup
        id: zig
        env:
          ZIG_PACKAGE: ${{ matrix.id == 'windows-arm64' && 'win32-x64' || matrix.zig }}
          HKD_ZIG_TEST_TARGET: ${{ matrix.id == 'windows-arm64' && 'aarch64-windows' || '' }}
          HKD_NATIVE_OUTPUT_DIR: ${{ runner.temp }}/hkd-runtime
          HKD_PREBUILT_RUNTIME: ${{ matrix.id == 'windows-arm64' && 'true' || 'false' }}
          HKD_EXPECTED_RUNTIME_SHA256: ${{ matrix.id == 'windows-arm64' && needs.windows-arm64-runtime-crossbuild.outputs.runtime-sha256 || '' }}
        run: node scripts/ci-zig.cjs
      - name: Run CLI correctness and exit-code checks
        run: node scripts/ci-smoke.cjs
      - name: Build and verify standalone release package
        env:
          HKD_BUILD_RUNNER: ${{ matrix.runner }}
          HKD_ZIG_VERSION: ${{ steps.zig.outputs.version }}
          ZIG_PACKAGE: ${{ matrix.id == 'windows-arm64' && 'win32-x64' || matrix.zig }}
          HKD_ZIG_TEST_TARGET: ${{ matrix.id == 'windows-arm64' && 'aarch64-windows' || '' }}
          HKD_DIST_DIR: ${{ runner.temp }}/hkd-release-dist
        run: npm run package
      - name: Verify package provenance for this runner
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          PACKAGE_ID: ${{ matrix.id }}
          EXPECTED_ZIG_PACKAGE: ${{ matrix.id == 'windows-arm64' && 'win32-x64' || matrix.zig }}
          EXPECTED_ZIG_TEST_TARGET: ${{ matrix.id == 'windows-arm64' && 'aarch64-windows' || '' }}
          HKD_DIST_DIR: ${{ runner.temp }}/hkd-release-dist
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = path.join(process.env.HKD_DIST_DIR, 'releases');
          const files = fs.readdirSync(dir).filter((name) => name.endsWith('.tar.gz'));
          if (files.length !== 1 || !files[0].includes(`-${process.env.PACKAGE_ID}.tar.gz`)) {
            throw new Error(`Expected one package for ${process.env.PACKAGE_ID}; got ${files.join(', ')}`);
          }
          const archivePath = path.join(dir, files[0]).split(path.sep).join('/');
          const { readPackageManifest } = require('./scripts/release-archive.cjs');
          const manifest = readPackageManifest(archivePath);
          if (manifest.sourceCommit !== process.env.EXPECTED_COMMIT) throw new Error(`Wrong source commit: ${manifest.sourceCommit}`);
          if (!manifest.zigVersion || !manifest.zigPackage || !manifest.buildRunner || !manifest.nodeVersion) throw new Error('Missing build provenance');
          if (manifest.zigPackage !== process.env.EXPECTED_ZIG_PACKAGE) throw new Error(`Unexpected Zig compiler package: ${manifest.zigPackage}`);
          if ((manifest.zigTestTarget || '') !== process.env.EXPECTED_ZIG_TEST_TARGET) throw new Error(`Unexpected Zig test target: ${manifest.zigTestTarget}`);
          console.log(JSON.stringify({ package: files[0], sourceCommit: manifest.sourceCommit, runner: manifest.buildRunner, node: manifest.nodeVersion, zig: manifest.zigVersion }, null, 2));
          NODE
      - name: Upload verified platform package
        uses: actions/upload-artifact@v6
        with:
          name: hkd-release-${{ matrix.id }}
          path: ${{ runner.temp }}/hkd-release-dist/releases/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  assemble-release-candidate:
    name: Assemble verified release bundle
    needs: build-and-verify
    runs-on: ubuntu-24.04
    if: always() && needs.build-and-verify.result == 'success'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download all six native packages
        uses: actions/download-artifact@v7
        with:
          pattern: hkd-release-*
          path: release-assets
          merge-multiple: true
      - name: Generate and validate release manifest and checksums
        env:
          HKD_RELEASE_DIR: release-assets
        run: node scripts/create-release-manifest.cjs
      - name: Preserve verified release candidate bundle
        uses: actions/upload-artifact@v6
        with:
          name: hkd-${{ github.event_name == 'push' && github.ref_name || format('candidate-{0}', github.sha) }}
          path: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/release-manifest.json
            release-assets/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 90
  publish-release:
    name: Publish official GitHub Release
    needs: assemble-release-candidate
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.assemble-release-candidate.result == 'success'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download verified release bundle
        uses: actions/download-artifact@v7
        with:
          name: hkd-${{ github.ref_name }}
          path: release-assets
      - name: Publish the verified assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$version"
          gh release create "$TAG_NAME" release-assets/*.tar.gz release-assets/SHA256SUMS release-assets/release-manifest.json --verify-tag --title "HKD $version" --notes-file release-assets/RELEASE_NOTES.md --latest
